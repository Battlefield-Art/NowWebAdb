<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1efe8" />
    <title>NowWebAdb</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('nowwebadb.theme');
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          var locale = localStorage.getItem('nowwebadb.locale');
          root.lang =
            locale === 'en-US' || locale === 'zh-CN'
              ? locale
              : (navigator.language || 'zh-CN').toLowerCase().indexOf('zh') === 0
                ? 'zh-CN'
                : 'en-US';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#131418' : '#f1efe8');
        } catch (error) {
          /* Private mode may block storage; defaults still render. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
